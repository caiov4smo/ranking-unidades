<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>Ranking Unidades - V4 Company</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --card-bg: #181818;
            --text-main: #ffffff;
            --text-muted: #8c8c8c;
            --v4-red: #E50914;
            --v4-red-dark: #80050b;
            --v4-red-glow: rgba(229, 9, 20, 0.5);
            --bar-bg: #2a2a2a;
            --gold: #FFD700;
            --silver: #E0E0E0;
            --bronze: #CD7F32;
            --green-money: #00E676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER V4 STYLE */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: #000000;
            border-bottom: 2px solid var(--v4-red);
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.15);
        }

        .header-brand h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .v4-select {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid var(--v4-red);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.1);
        }

        .v4-select:focus, .v4-select:hover {
            box-shadow: 0 0 12px var(--v4-red-glow);
            border-color: #ff1a26;
        }

        .header-month {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .v4-logo-right {
            height: 48px;
            width: 48px;
            object-fit: contain;
            border-radius: 2px;
        }

        /* TABELA DE DADOS */
        .table-section {
            flex: 1;
            padding: 1.5rem 2rem 1.5rem 2rem;
            overflow-y: auto;
            position: relative;
        }

        .table-section::-webkit-scrollbar {
            width: 8px;
        }
        .table-section::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        .table-section::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        .table-section::-webkit-scrollbar-thumb:hover {
            background: var(--v4-red);
        }

        .table-wrapper {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-color);
        }

        th {
            padding: 0.6rem 1rem;
            text-align: right;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        th span {
            background-color: #171717;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            border-bottom: 2px solid var(--v4-red);
            color: #ffffff;
        }

        th:nth-child(1), th:nth-child(2) { text-align: left; }
        th:nth-child(2) { width: 28%; }

        tr {
            background-color: var(--panel-bg);
            transition: all 0.2s ease;
            border-radius: 6px;
        }

        tr:hover {
            background-color: #1a1a1a;
            transform: scale(1.002);
        }

        td {
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            text-align: right;
            font-weight: 500;
            color: #e5e5e5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td:nth-child(1), td:nth-child(2) { text-align: left; }

        td.rank-col { 
            font-weight: 800; 
            color: var(--text-muted); 
            text-align: center;
            font-size: 1.1rem;
            width: 80px;
        }

        td.regional-col {
            font-weight: 700;
            color: #a0a0a0;
            text-align: center;
        }
        
        td.unit-col {
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* BADGES DE RANKING (1º, 2º, 3º) */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 32px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1.1rem;
        }

        /* SUPER DESTAQUES - TOP 3 */
        /* 1º LUGAR (VERMELHO V4 PREMIUM) */
        tr.top-rank-1 {
            background: linear-gradient(90deg, rgba(229, 9, 20, 0.22) 0%, rgba(24, 12, 14, 0.95) 100%) !important;
            outline: 2px solid var(--v4-red);
            box-shadow: 0 0 18px var(--v4-red-glow);
        }
        tr.top-rank-1 td {
            padding: 1.1rem 1rem;
            font-size: 1.05rem;
            font-weight: 600;
        }
        tr.top-rank-1 .rank-badge {
            background: var(--v4-red);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.8);
        }
        tr.top-rank-1 td.unit-col {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        /* 2º LUGAR (BRANCO / PRATA) */
        tr.top-rank-2 {
            background: linear-gradient(90deg, rgba(224, 224, 224, 0.15) 0%, rgba(20, 20, 20, 0.95) 100%) !important;
            outline: 2px solid var(--silver);
            box-shadow: 0 0 12px rgba(224, 224, 224, 0.2);
        }
        tr.top-rank-2 td {
            padding: 1rem 1rem;
            font-size: 1.02rem;
            font-weight: 600;
        }
        tr.top-rank-2 .rank-badge {
            background: var(--silver);
            color: #111111;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        tr.top-rank-2 td.unit-col {
            color: #ffffff;
            font-size: 1.08rem;
            font-weight: 800;
        }

        /* 3º LUGAR (BRONZE) */
        tr.top-rank-3 {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.18) 0%, rgba(20, 18, 14, 0.95) 100%) !important;
            outline: 2px solid var(--bronze);
            box-shadow: 0 0 12px rgba(205, 127, 50, 0.25);
        }
        tr.top-rank-3 td {
            padding: 0.95rem 1rem;
            font-size: 1rem;
            font-weight: 600;
        }
        tr.top-rank-3 .rank-badge {
            background: var(--bronze);
            color: #ffffff;
            box-shadow: 0 0 8px rgba(205, 127, 50, 0.5);
        }
        tr.top-rank-3 td.unit-col {
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
        }

        /* Progress Bar V4 Red */
        .progress-cell {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .progress-text {
            font-weight: 700;
            width: 65px;
            text-align: right;
            color: #fff;
        }

        .progress-bar-bg {
            width: 80px;
            height: 8px;
            background-color: var(--bar-bg);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--v4-red);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--v4-red-glow);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DA PÁGINA -->
    <header>
        <div class="header-brand">
            <h1>Ranking Unidades</h1>
        </div>
        <div class="header-controls">
            <!-- Filtro por Regional -->
            <select id="regional-filter" class="v4-select">
                <option value="all">Todas as Regionais</option>
            </select>
            <div class="header-month" id="current-month">
                <!-- SETEMBRO DE 2026 -->
            </div>
            <img src="logo-v4.jpg" alt="V4 Company" class="v4-logo-right">
        </div>
    </header>

    <!-- TABELA DE DADOS (1º AO ÚLTIMO COLOCADO COM SUPER DESTAQUE) -->
    <section class="table-section">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th><span>Rank</span></th>
                        <th><span>Unidade</span></th>
                        <th><span>Meta Mês</span></th>
                        <th><span>Meta Semana</span></th>
                        <th><span>Recebido</span></th>
                        <th><span>Delta Semana</span></th>
                        <th><span>Realizado</span></th>
                        <th><span>Disponível Ano</span></th>
                        <th><span>Regional</span></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </section>

    <script>
        let allData = [];

        // ATUALIZAR MÊS VIGENTE (EX: SETEMBRO DE 2026)
        function updateCurrentMonth() {
            const now = new Date();
            const monthNames = [
                "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
                "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
            ];
            const monthStr = monthNames[now.getMonth()];
            const yearStr = now.getFullYear();
            document.getElementById('current-month').textContent = `${monthStr} DE ${yearStr}`;
        }
        updateCurrentMonth();

        // FORMATAR MOEDA COM R$
        function formatCurrency(val) {
            if (val === undefined || val === null || val === '') return 'R$ 0,00';
            if (val.toString().includes('R$')) return val;
            return 'R$ ' + val;
        }

        // LIMPAR PREFIXO V4 COMPANY
        function cleanUnitName(name) {
            if (!name) return '';
            return name.replace(/^V4\s+Company\s+/i, '').trim();
        }

        // CARREGAMENTO DO JSON
        async function loadData() {
            try {
                const response = await fetch('dados.json');
                if (!response.ok) throw new Error('Falha ao carregar o arquivo JSON.');
                const data = await response.json();
                
                allData = data.map(item => {
                    let realizadoLimpo = (item.realizado || '0').replace('%', '').replace(',', '.');
                    let realizadoNum = parseFloat(realizadoLimpo);
                    if (isNaN(realizadoNum)) realizadoNum = 0;

                    return {
                        ...item,
                        unidade: cleanUnitName(item.unidade),
                        realizadoNum: realizadoNum
                    };
                });

                populateFilter(allData);
                renderDashboard(allData);
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--v4-red);">Erro ao carregar dados. Certifique-se de que o arquivo 'dados.json' está na mesma pasta.</td></tr>`;
            }
        }

        // POPULAR FILTRO DE REGIONAIS
        function populateFilter(data) {
            const filter = document.getElementById('regional-filter');
            const regionais = [...new Set(data.map(item => item.str_regional).filter(r => r && r.trim() !== ''))].sort();
            
            regionais.forEach(reg => {
                const option = document.createElement('option');
                option.value = reg;
                option.textContent = reg;
                filter.appendChild(option);
            });

            filter.addEventListener('change', (e) => {
                const selected = e.target.value;
                if (selected === 'all') {
                    renderDashboard(allData);
                } else {
                    const filtered = allData.filter(item => item.str_regional === selected);
                    renderDashboard(filtered);
                }
            });
        }

        // RENDERIZAR DASHBOARD
        function renderDashboard(data) {
            const sortedData = [...data].sort((a, b) => b.realizadoNum - a.realizadoNum);
            renderTable(sortedData);
        }

        // RENDERIZAR TABELA DE RANKING (COM BADGES E CONTORNOS DE DESTAQUE NO TOP 3)
        function renderTable(data) {
            const tableBody = document.getElementById('table-body');
            let html = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Nenhuma unidade encontrada para esta regional.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const realRank = index + 1; // Começa no 1º
                const progressWidth = row.realizadoNum > 100 ? 100 : row.realizadoNum;
                
                // Lógica de puxar a semana correspondente à coluna 'semana_corte'
                const semanaCorteStr = row.semana_corte ? row.semana_corte.toString().trim() : '3';
                const metaSemanaVal = row['semana_' + semanaCorteStr] || '0';
                
                // Estruturação do Rank com Badge de Destaque
                let rankRowClass = '';
                let rankDisplay = `${realRank}º`;

                if (realRank === 1) {
                    rankRowClass = 'top-rank-1';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                } else if (realRank === 2) {
                    rankRowClass = 'top-rank-2';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                } else if (realRank === 3) {
                    rankRowClass = 'top-rank-3';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                }

                html += `
                    <tr class="${rankRowClass}">
                        <td class="rank-col">${rankDisplay}</td>
                        <td class="unit-col" title="${row.unidade}">${row.unidade}</td>
                        <td>${formatCurrency(row.provisionado)}</td>
                        <td>${formatCurrency(metaSemanaVal)}</td>
                        <td>${formatCurrency(row.recebido)}</td>
                        <td>${formatCurrency(row.valor_faltante_meta)}</td>
                        <td>
                            <div class="progress-cell">
                                <span class="progress-text">${row.realizado || '0%'}</span>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${progressWidth}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td>${formatCurrency(row.disponivel_ano)}</td>
                        <td class="regional-col">${row.str_regional || '-'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>

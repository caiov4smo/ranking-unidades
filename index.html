<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Unidades - V4 Company</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --card-bg: #181818;
            --text-main: #ffffff;
            --text-muted: #8c8c8c;
            --v4-red: #E50914;
            --v4-red-dark: #80050b;
            --v4-red-glow: rgba(229, 9, 20, 0.4);
            --bar-bg: #2a2a2a;
            --gold: #CD7F32;
            --silver: #E0E0E0;
            --bronze: #CD7F32;
            --green-money: #00E676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER V4 STYLE */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: #000000;
            border-bottom: 2px solid var(--v4-red);
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.15);
        }

        .header-brand h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .v4-select {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid var(--v4-red);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.1);
        }

        .v4-select:focus, .v4-select:hover {
            box-shadow: 0 0 12px var(--v4-red-glow);
            border-color: #ff1a26;
        }

        .header-month {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .v4-logo-right {
            height: 48px;
            width: 48px;
            object-fit: contain;
            border-radius: 2px;
        }

        /* PÓDIO TOP 3 ESTILO NOVO (SEM FOTOS) */
        .podium-section {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 2.5rem 0 1.5rem 0;
            gap: 1.5rem;
            min-height: 250px;
        }

        .podium-card {
            background: var(--panel-bg);
            border-radius: 4px;
            padding: 1.8rem 1.2rem 1.2rem 1.2rem;
            text-align: center;
            width: 320px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Linha e Badge do Topo do Pódio */
        .podium-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
        }

        .podium-badge {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 1º Lugar */
        .podium-card.rank-1 { 
            height: 220px; 
            width: 360px; 
            z-index: 3; 
            background: #161616;
            border-top: 3px solid var(--v4-red);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.25);
        }
        .podium-card.rank-1 .podium-badge { 
            background: var(--v4-red); 
        }

        /* 2º Lugar */
        .podium-card.rank-2 { 
            height: 195px; 
            z-index: 2; 
            border-top: 3px solid #ffffff;
        }
        .podium-card.rank-2 .podium-badge { 
            background: #2a2a2a; 
            border: 1px solid #ffffff;
        }

        /* 3º Lugar */
        .podium-card.rank-3 { 
            height: 175px; 
            z-index: 1; 
            border-top: 3px solid #CD7F32;
        }
        .podium-card.rank-3 .podium-badge { 
            background: #2a2a2a; 
            border: 1px solid #CD7F32;
            color: #CD7F32;
        }

        .podium-name {
            font-size: 1.1rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
        }

        .podium-card.rank-1 .podium-name {
            color: var(--v4-red);
            font-size: 1.25rem;
        }

        .podium-value-main {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--green-money);
            margin-bottom: 0.2rem;
            letter-spacing: 0.5px;
        }

        .podium-value-sub {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .podium-pct-pill {
            background-color: #262626;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.3rem 1.2rem;
            border-radius: 4px;
        }

        .podium-card.rank-1 .podium-pct-pill {
            background-color: var(--v4-red);
            color: #ffffff;
        }

        /* TABELA DE DADOS (A PARTIR DO 4º LUGAR) */
        .table-section {
            flex: 1;
            padding: 0 2rem 1.5rem 2rem;
            overflow-y: auto;
            position: relative;
        }

        .table-section::-webkit-scrollbar {
            width: 8px;
        }
        .table-section::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        .table-section::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        .table-section::-webkit-scrollbar-thumb:hover {
            background: var(--v4-red);
        }

        .table-wrapper {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-color);
        }

        th {
            padding: 0.6rem 1rem;
            text-align: right;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        th span {
            background-color: #171717;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            border-bottom: 2px solid var(--v4-red);
            color: #ffffff;
        }

        th:nth-child(1), th:nth-child(2) { text-align: left; }
        th:nth-child(2) { width: 28%; }

        tr {
            background-color: var(--panel-bg);
            transition: background-color 0.2s;
            border-radius: 4px;
        }

        tr:hover {
            background-color: #1a1a1a;
        }

        td {
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            text-align: right;
            font-weight: 500;
            color: #e5e5e5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td:nth-child(1), td:nth-child(2) { text-align: left; }

        td.rank-col { 
            font-weight: 800; 
            color: var(--text-muted); 
            text-align: center;
            font-size: 1.1rem;
            width: 60px;
        }

        td.regional-col {
            font-weight: 700;
            color: #a0a0a0;
            text-align: center;
        }
        
        td.unit-col {
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Progress Bar V4 Red */
        .progress-cell {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .progress-text {
            font-weight: 700;
            width: 65px;
            text-align: right;
            color: #fff;
        }

        .progress-bar-bg {
            width: 80px;
            height: 8px;
            background-color: var(--bar-bg);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--v4-red);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--v4-red-glow);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DA PÁGINA -->
    <header>
        <div class="header-brand">
            <h1>Ranking Unidades</h1>
        </div>
        <div class="header-controls">
            <!-- Filtro por Regional -->
            <select id="regional-filter" class="v4-select">
                <option value="all">Todas as Regionais</option>
            </select>
            <div class="header-month" id="current-month">
                <!-- SETEMBRO DE 2026 -->
            </div>
            <img src="logo-v4.jpg" alt="V4 Company" class="v4-logo-right">
        </div>
    </header>

    <!-- PÓDIO TOP 3 (DESIGN NOVO SEM FOTO) -->
    <section class="podium-section" id="podium-container">
    </section>

    <!-- TABELA DE DADOS (A PARTIR DO 4º LUGAR) -->
    <section class="table-section">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th><span>Rank</span></th>
                        <th><span>Unidade</span></th>
                        <th><span>Meta Mês</span></th>
                        <th><span>Meta Semana</span></th>
                        <th><span>Recebido</span></th>
                        <th><span>Delta Semana</span></th>
                        <th><span>Realizado</span></th>
                        <th><span>Disponível Ano</span></th>
                        <th><span>Regional</span></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </section>

    <script>
        let allData = [];

        // ATUALIZAR MÊS VIGENTE (EX: SETEMBRO DE 2026)
        function updateCurrentMonth() {
            const now = new Date();
            const monthNames = [
                "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
                "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
            ];
            const monthStr = monthNames[now.getMonth()];
            const yearStr = now.getFullYear();
            document.getElementById('current-month').textContent = `${monthStr} DE ${yearStr}`;
        }
        updateCurrentMonth();

        // FORMATAR MOEDA COM R$
        function formatCurrency(val) {
            if (val === undefined || val === null || val === '') return 'R$ 0,00';
            if (val.toString().includes('R$')) return val;
            return 'R$ ' + val;
        }

        // LIMPAR PREFIXO V4 COMPANY
        function cleanUnitName(name) {
            if (!name) return '';
            return name.replace(/^V4\s+Company\s+/i, '').trim();
        }

        // CARREGAMENTO DO JSON
        async function loadData() {
            try {
                const response = await fetch('dados.json');
                if (!response.ok) throw new Error('Falha ao carregar o arquivo JSON.');
                const data = await response.json();
                
                allData = data.map(item => {
                    let realizadoLimpo = (item.realizado || '0').replace('%', '').replace(',', '.');
                    let realizadoNum = parseFloat(realizadoLimpo);
                    if (isNaN(realizadoNum)) realizadoNum = 0;

                    return {
                        ...item,
                        unidade: cleanUnitName(item.unidade),
                        realizadoNum: realizadoNum
                    };
                });

                populateFilter(allData);
                renderDashboard(allData);
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--v4-red);">Erro ao carregar dados. Certifique-se de que o arquivo 'dados.json' está na mesma pasta.</td></tr>`;
            }
        }

        // POPULAR FILTRO DE REGIONAIS
        function populateFilter(data) {
            const filter = document.getElementById('regional-filter');
            const regionais = [...new Set(data.map(item => item.str_regional).filter(r => r && r.trim() !== ''))].sort();
            
            regionais.forEach(reg => {
                const option = document.createElement('option');
                option.value = reg;
                option.textContent = reg;
                filter.appendChild(option);
            });

            filter.addEventListener('change', (e) => {
                const selected = e.target.value;
                if (selected === 'all') {
                    renderDashboard(allData);
                } else {
                    const filtered = allData.filter(item => item.str_regional === selected);
                    renderDashboard(filtered);
                }
            });
        }

        // RENDERIZAR DASHBOARD
        function renderDashboard(data) {
            const sortedData = [...data].sort((a, b) => b.realizadoNum - a.realizadoNum);
            renderPodium(sortedData);
            renderTable(sortedData);
        }

        // RENDERIZAR PÓDIO TOP 3
        function renderPodium(data) {
            const podiumContainer = document.getElementById('podium-container');
            podiumContainer.innerHTML = '';
            
            if (data.length === 0) return;

            const top3 = [];
            if (data[1]) top3.push({ rank: 2, class: 'rank-2', data: data[1] });
            if (data[0]) top3.push({ rank: 1, class: 'rank-1', data: data[0] });
            if (data[2]) top3.push({ rank: 3, class: 'rank-3', data: data[2] });

            let html = '';
            top3.forEach(item => {
                html += `
                    <div class="podium-card ${item.class}">
                        <div class="podium-badge">${item.rank}º</div>
                        <div class="podium-name" title="${item.data.unidade}">${item.data.unidade}</div>
                        <div class="podium-value-main">${formatCurrency(item.data.recebido)}</div>
                        <div class="podium-value-sub">Meta: ${formatCurrency(item.data.provisionado)}</div>
                        <div class="podium-pct-pill">${item.data.realizado}</div>
                    </div>
                `;
            });

            podiumContainer.innerHTML = html;
        }

        // RENDERIZAR TABELA DE RANKING (A PARTIR DO 4º LUGAR)
        function renderTable(data) {
            const tableBody = document.getElementById('table-body');
            let html = '';

            // Se a lista tiver 3 ou menos itens, a tabela fica vazia
            if (data.length <= 3) {
                tableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Nenhuma unidade adicional encontrada para esta visualização.</td></tr>';
                return;
            }

            // Pega do 4º colocado em diante (índice 3 em diante)
            const listData = data.slice(3);

            listData.forEach((row, index) => {
                const realRank = index + 4; // Começa no 4º
                const progressWidth = row.realizadoNum > 100 ? 100 : row.realizadoNum;
                
                // Lógica de puxar a semana correspondente à coluna 'semana_corte'
                const semanaCorteStr = row.semana_corte ? row.semana_corte.toString().trim() : '3';
                const metaSemanaVal = row['semana_' + semanaCorteStr] || '0';
                
                html += `
                    <tr>
                        <td class="rank-col">${realRank}º</td>
                        <td class="unit-col" title="${row.unidade}">${row.unidade}</td>
                        <td>${formatCurrency(row.provisionado)}</td>
                        <td>${formatCurrency(metaSemanaVal)}</td>
                        <td>${formatCurrency(row.recebido)}</td>
                        <td>${formatCurrency(row.valor_faltante_meta)}</td>
                        <td>
                            <div class="progress-cell">
                                <span class="progress-text">${row.realizado || '0%'}</span>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${progressWidth}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td>${formatCurrency(row.disponivel_ano)}</td>
                        <td class="regional-col">${row.str_regional || '-'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Unidades - V4 Company</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --card-bg: #181818;
            --text-main: #ffffff;
            --text-muted: #8c8c8c;
            --v4-red: #E50914;
            --v4-red-dark: #80050b;
            --v4-red-glow: rgba(229, 9, 20, 0.5);
            --bar-bg: #2a2a2a;
            --silver: #E0E0E0;
            --bronze: #CD7F32;
            --green-money: #00E676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER FIXADO */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: #000000;
            border-bottom: 2px solid var(--v4-red);
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.15);
        }

        .header-brand h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        /* TOGGLE DE SEMANA */
        .week-toggle-container {
            display: flex;
            background-color: #1a1a1a;
            border: 1px solid var(--v4-red);
            border-radius: 6px;
            padding: 2px;
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.1);
        }

        .week-btn {
            background: transparent;
            color: #8c8c8c;
            border: none;
            padding: 0.5rem 0.9rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            outline: none;
        }

        .week-btn.active {
            background: var(--v4-red);
            color: #ffffff;
            box-shadow: 0 0 8px var(--v4-red-glow);
        }

        /* SELECT DE REGIONAL COM SETA AJUSTADA */
        .v4-select {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid var(--v4-red);
            padding: 0.6rem 2.5rem 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.1);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23ffffff' d='M1.41 0L6 4.58 10.59 0 12 1.41l-6 6-6-6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 12px;
        }

        .v4-select:focus, .v4-select:hover {
            box-shadow: 0 0 12px var(--v4-red-glow);
            border-color: #ff1a26;
        }

        .header-month {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .v4-logo-right {
            height: 48px;
            width: 48px;
            object-fit: contain;
            border-radius: 2px;
        }

        /* TABELA DE DADOS */
        .table-section {
            flex: 1;
            padding: 1.5rem 2rem 1.5rem 2rem;
            overflow-y: auto;
            position: relative;
        }

        .table-section::-webkit-scrollbar {
            width: 8px;
        }
        .table-section::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        .table-section::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        .table-section::-webkit-scrollbar-thumb:hover {
            background: var(--v4-red);
        }

        .table-wrapper {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-color);
        }

        th {
            padding: 0.6rem 0.8rem;
            text-align: right;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th span {
            background-color: #171717;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            border-bottom: 2px solid var(--v4-red);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        th.sortable:hover span {
            background-color: #262626;
            border-bottom-color: #ff1a26;
        }

        .sort-icon {
            font-style: normal;
            font-size: 0.75rem;
            opacity: 0.4;
        }

        th.active-sort .sort-icon {
            opacity: 1;
            color: var(--v4-red);
        }

        th:nth-child(1), th:nth-child(2) { text-align: left; }
        th:nth-child(2) { width: 28%; }

        tr {
            background-color: var(--panel-bg);
            transition: all 0.2s ease;
            border-radius: 6px;
        }

        tr:hover {
            background-color: #1a1a1a;
            transform: scale(1.002);
        }

        td {
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            text-align: right;
            font-weight: 500;
            color: #e5e5e5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td:nth-child(1), td:nth-child(2) { text-align: left; }

        td.rank-col { 
            font-weight: 800; 
            color: var(--text-muted); 
            text-align: center;
            font-size: 1.1rem;
            width: 80px;
        }

        td.regional-col {
            font-weight: 700;
            color: #a0a0a0;
            text-align: center;
        }
        
        td.unit-col {
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* BADGES DE RANKING (1º, 2º, 3º) */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 32px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1.1rem;
        }

        /* SUPER DESTAQUES - TOP 3 */
        tr.top-rank-1 {
            background: linear-gradient(90deg, rgba(229, 9, 20, 0.22) 0%, rgba(24, 12, 14, 0.95) 100%) !important;
            outline: 2px solid var(--v4-red);
            box-shadow: 0 0 18px var(--v4-red-glow);
        }
        tr.top-rank-1 td {
            padding: 1.1rem 1rem;
            font-size: 1.05rem;
            font-weight: 600;
        }
        tr.top-rank-1 .rank-badge {
            background: var(--v4-red);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.8);
        }
        tr.top-rank-1 td.unit-col {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        tr.top-rank-2 {
            background: linear-gradient(90deg, rgba(224, 224, 224, 0.15) 0%, rgba(20, 20, 20, 0.95) 100%) !important;
            outline: 2px solid var(--silver);
            box-shadow: 0 0 12px rgba(224, 224, 224, 0.2);
        }
        tr.top-rank-2 td {
            padding: 1rem 1rem;
            font-size: 1.02rem;
            font-weight: 600;
        }
        tr.top-rank-2 .rank-badge {
            background: var(--silver);
            color: #111111;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        tr.top-rank-2 td.unit-col {
            color: #ffffff;
            font-size: 1.08rem;
            font-weight: 800;
        }

        tr.top-rank-3 {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.18) 0%, rgba(20, 18, 14, 0.95) 100%) !important;
            outline: 2px solid var(--bronze);
            box-shadow: 0 0 12px rgba(205, 127, 50, 0.25);
        }
        tr.top-rank-3 td {
            padding: 0.95rem 1rem;
            font-size: 1rem;
            font-weight: 600;
        }
        tr.top-rank-3 .rank-badge {
            background: var(--bronze);
            color: #ffffff;
            box-shadow: 0 0 8px rgba(205, 127, 50, 0.5);
        }
        tr.top-rank-3 td.unit-col {
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
        }

        /* Progress Bar V4 Red */
        .progress-cell {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .progress-text {
            font-weight: 700;
            width: 65px;
            text-align: right;
            color: #fff;
        }

        .progress-bar-bg {
            width: 80px;
            height: 8px;
            background-color: var(--bar-bg);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--v4-red);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--v4-red-glow);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DA PÁGINA (FIXADO) -->
    <header>
        <div class="header-brand">
            <h1>Ranking Unidades</h1>
        </div>
        <div class="header-controls">
            <!-- TOGGLE DE SEMANA -->
            <div class="week-toggle-container">
                <button id="btn-current-week" class="week-btn active" onclick="setWeekMode('current')">Semana Atual</button>
                <button id="btn-prev-week" class="week-btn" onclick="setWeekMode('prev')">Semana Anterior</button>
            </div>

            <!-- FILTRO DE REGIONAL COM SETA AJUSTADA -->
            <select id="regional-filter" class="v4-select">
                <option value="all">Todas as Regionais</option>
            </select>

            <div class="header-month" id="current-month">
                <!-- SETEMBRO DE 2026 -->
            </div>
            <img src="logo-v4.jpg" alt="V4 Company" class="v4-logo-right">
        </div>
    </header>

    <!-- TABELA DE DADOS -->
    <section class="table-section">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-col="realizadoNum"><span>Rank <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="unidade"><span>Unidade <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="provisionadoNum"><span>Meta Mês <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="metaSemanaNum"><span>Meta Semana <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="recebidoNum"><span>Recebido <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="deltaSemanaNum"><span>Delta Semana <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="realizadoNum"><span>Realizado <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="disponivelAnoNum"><span>Disponível Ano <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="str_regional"><span>Regional <i class="sort-icon">↕</i></span></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </section>

    <script>
        let allData = [];
        let weekMode = 'current'; // 'current' ou 'prev'
        let currentSortCol = 'realizadoNum';
        let currentSortDir = 'desc';

        // ATUALIZAR MÊS VIGENTE (EX: SETEMBRO DE 2026)
        function updateCurrentMonth() {
            const now = new Date();
            const monthNames = [
                "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
                "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
            ];
            const monthStr = monthNames[now.getMonth()];
            const yearStr = now.getFullYear();
            document.getElementById('current-month').textContent = `${monthStr} DE ${yearStr}`;
        }
        updateCurrentMonth();

        // FORMATAR MOEDA COM R$
        function formatCurrency(val) {
            if (val === undefined || val === null || val === '') return 'R$ 0,00';
            if (val.toString().includes('R$')) return val;
            return 'R$ ' + val;
        }

        // LIMPAR PREFIXO V4 COMPANY
        function cleanUnitName(name) {
            if (!name) return '';
            return name.replace(/^V4\s+Company\s+/i, '').trim();
        }

        // CONVERTER VALOR BRASILEIRO PARA FLOAT
        function parseBrFloat(str) {
            if (!str) return 0;
            let clean = str.toString().replace(/R\$\s?/, '').replace(/\./g, '').replace(',', '.').replace('%', '').trim();
            let num = parseFloat(clean);
            return isNaN(num) ? 0 : num;
        }

        // ALTERAR MODO DE SEMANA (TOGGLE)
        function setWeekMode(mode) {
            weekMode = mode;
            document.getElementById('btn-current-week').classList.toggle('active', mode === 'current');
            document.getElementById('btn-prev-week').classList.toggle('active', mode === 'prev');
            
            // Recalcula campos dependentes da semana
            recalculateData();
            applyFilterAndSort();
        }

        // RECALCULAR DADOS CONFORME A SEMANA SELECIONADA
        function recalculateData() {
            allData.forEach(item => {
                const semanaCorteNum = parseInt(item.semana_corte || '3', 10);
                let targetWeekNum = semanaCorteNum;

                if (weekMode === 'prev') {
                    targetWeekNum = Math.max(1, semanaCorteNum - 1);
                }

                // 1. Meta Semana
                const metaSemanaVal = item['semana_' + targetWeekNum] || '0';
                item.metaSemanaStr = metaSemanaVal;
                item.metaSemanaNum = parseBrFloat(metaSemanaVal);

                // 2. Recebido
                const recebidoKey = 'recebido_ate_sem' + targetWeekNum;
                const recebidoVal = item[recebidoKey] !== undefined ? item[recebidoKey] : (item.recebido || '0');
                item.recebidoStr = recebidoVal;
                item.recebidoNum = parseBrFloat(recebidoVal);

                // 3. Realizado %
                const realizadoKey = 'realizado_sem' + targetWeekNum;
                const realizadoVal = item[realizadoKey] !== undefined ? item[realizadoKey] : (item.realizado || '0%');
                item.realizadoStr = realizadoVal;
                item.realizadoNum = parseBrFloat(realizadoVal);

                // 4. Delta Semana (Faltante Meta da Semana): Max(0, MetaSemana - RecebidoAtéAquelePonto)
                let deltaNum = item.metaSemanaNum - item.recebidoNum;
                if (deltaNum < 0) deltaNum = 0;
                item.deltaSemanaNum = deltaNum;
                item.deltaSemanaStr = deltaNum.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            });
        }

        // CARREGAMENTO DO JSON
        async function loadData() {
            try {
                const response = await fetch('dados.json.json');
                if (!response.ok) throw new Error('Falha ao carregar o arquivo JSON.');
                const data = await response.json();
                
                allData = data.map(item => {
                    return {
                        ...item,
                        unidade: cleanUnitName(item.unidade),
                        provisionadoNum: parseBrFloat(item.provisionado),
                        disponivelAnoNum: parseBrFloat(item.disponivel_ano)
                    };
                });

                recalculateData();
                populateFilter(allData);
                setupSortHeaders();
                applyFilterAndSort();
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--v4-red);">Erro ao carregar dados. Certifique-se de que o arquivo 'dados.json.json' está na mesma pasta.</td></tr>`;
            }
        }

        // POPULAR FILTRO DE REGIONAIS
        function populateFilter(data) {
            const filter = document.getElementById('regional-filter');
            const regionais = [...new Set(data.map(item => item.str_regional).filter(r => r && r.trim() !== ''))].sort();
            
            regionais.forEach(reg => {
                const option = document.createElement('option');
                option.value = reg;
                option.textContent = reg;
                filter.appendChild(option);
            });

            filter.addEventListener('change', () => {
                applyFilterAndSort();
            });
        }

        // CONFIGURAR CLIQUE NOS CABEÇALHOS PARA ORDENAÇÃO
        function setupSortHeaders() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.getAttribute('data-col');
                    if (currentSortCol === col) {
                        currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSortCol = col;
                        currentSortDir = 'desc'; // Padrão desc ao trocar de coluna
                    }
                    applyFilterAndSort();
                });
            });
        }

        // APLICAR FILTRAGEM E ORDENAÇÃO
        function applyFilterAndSort() {
            const selectedReg = document.getElementById('regional-filter').value;
            let filtered = allData;

            if (selectedReg !== 'all') {
                filtered = allData.filter(item => item.str_regional === selectedReg);
            }

            // Ordenar
            const sorted = [...filtered].sort((a, b) => {
                let valA = a[currentSortCol];
                let valB = b[currentSortCol];

                if (typeof valA === 'string') {
                    valA = valA.toLowerCase();
                    valB = (valB || '').toLowerCase();
                    return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }

                valA = valA || 0;
                valB = valB || 0;
                return currentSortDir === 'asc' ? valA - valB : valB - valA;
            });

            // Atualiza indicadores visuais dos cabeçalhos
            document.querySelectorAll('th.sortable').forEach(th => {
                const col = th.getAttribute('data-col');
                const icon = th.querySelector('.sort-icon');
                if (col === currentSortCol) {
                    th.classList.add('active-sort');
                    icon.textContent = currentSortDir === 'asc' ? '▲' : '▼';
                } else {
                    th.classList.remove('active-sort');
                    icon.textContent = '↕';
                }
            });

            renderTable(sorted);
        }

        // RENDERIZAR TABELA
        function renderTable(data) {
            const tableBody = document.getElementById('table-body');
            let html = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Nenhuma unidade encontrada para os filtros selecionados.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const realRank = index + 1; // Posição atual na lista filtrada
                const progressWidth = row.realizadoNum > 100 ? 100 : row.realizadoNum;
                
                // Estruturação do Rank com Badge de Destaque para o Top 3
                let rankRowClass = '';
                let rankDisplay = `${realRank}º`;

                if (realRank === 1) {
                    rankRowClass = 'top-rank-1';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                } else if (realRank === 2) {
                    rankRowClass = 'top-rank-2';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                } else if (realRank === 3) {
                    rankRowClass = 'top-rank-3';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                }

                html += `
                    <tr class="${rankRowClass}">
                        <td class="rank-col">${rankDisplay}</td>
                        <td class="unit-col" title="${row.unidade}">${row.unidade}</td>
                        <td>${formatCurrency(row.provisionado)}</td>
                        <td>${formatCurrency(row.metaSemanaStr)}</td>
                        <td>${formatCurrency(row.recebidoStr)}</td>
                        <td>${formatCurrency(row.deltaSemanaStr)}</td>
                        <td>
                            <div class="progress-cell">
                                <span class="progress-text">${row.realizadoStr || '0%'}</span>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${progressWidth}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td>${formatCurrency(row.disponivel_ano)}</td>
                        <td class="regional-col">${row.str_regional || '-'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>

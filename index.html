<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Unidades - V4 Company</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --card-bg: #181818;
            --text-main: #ffffff;
            --text-muted: #8c8c8c;
            --v4-red: #E50914;
            --v4-red-dark: #80050b;
            --v4-red-glow: rgba(229, 9, 20, 0.5);
            --bar-bg: #2a2a2a;
            --silver: #E0E0E0;
            --bronze: #CD7F32;
            --green-money: #00E676;
            --yellow-gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER FIXADO */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: #000000;
            border-bottom: 2px solid var(--v4-red);
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.15);
        }

        .header-brand h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        /* TOGGLE DE SEMANA */
        .week-toggle-container {
            display: flex;
            background-color: #1a1a1a;
            border: 1px solid var(--v4-red);
            border-radius: 6px;
            padding: 2px;
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.1);
        }

        .week-btn {
            background: transparent;
            color: #8c8c8c;
            border: none;
            padding: 0.5rem 0.9rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            outline: none;
        }

        .week-btn.active {
            background: var(--v4-red);
            color: #ffffff;
            box-shadow: 0 0 8px var(--v4-red-glow);
        }

        /* SELECTS COM SETA AJUSTADA */
        .v4-select {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid var(--v4-red);
            padding: 0.6rem 2.5rem 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.1);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23ffffff' d='M1.41 0L6 4.58 10.59 0 12 1.41l-6 6-6-6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 12px;
        }

        .v4-select:focus, .v4-select:hover {
            box-shadow: 0 0 12px var(--v4-red-glow);
            border-color: #ff1a26;
        }

        .header-month {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .v4-logo-right {
            height: 48px;
            width: 48px;
            object-fit: contain;
            border-radius: 2px;
        }

        /* SEÇÃO DOS COPOS (PROGRESSO DAS SEMANAS) */
        .glasses-section {
            padding: 1.2rem 2rem 0.5rem 2rem;
            flex-shrink: 0;
        }

        .glasses-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1.2rem;
            background-color: var(--panel-bg);
            padding: 1.2rem 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 230px;
        }

        .glass-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        .glass-top-realizado {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--green-money);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .glass-outer {
            width: 100%;
            max-width: 130px;
            background-color: #161616;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .glass-inner {
            width: 100%;
            transition: height 0.5s ease;
        }

        /* TEXTO DA PORCENTAGEM DENTRO DO COPO */
        .glass-pct-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            pointer-events: none;
            white-space: nowrap;
        }

        .glass-week-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .glass-bottom-meta {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* TABELA DE DADOS */
        .table-section {
            flex: 1;
            padding: 1rem 2rem 1.5rem 2rem;
            overflow-y: auto;
            position: relative;
        }

        .table-section::-webkit-scrollbar {
            width: 8px;
        }
        .table-section::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        .table-section::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        .table-section::-webkit-scrollbar-thumb:hover {
            background: var(--v4-red);
        }

        .table-wrapper {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-color);
        }

        th {
            padding: 0.6rem 0.8rem;
            text-align: right;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th span {
            background-color: #171717;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            border-bottom: 2px solid var(--v4-red);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        th.sortable:hover span {
            background-color: #262626;
            border-bottom-color: #ff1a26;
        }

        .sort-icon {
            font-style: normal;
            font-size: 0.75rem;
            opacity: 0.4;
        }

        th.active-sort .sort-icon {
            opacity: 1;
            color: var(--v4-red);
        }

        th:nth-child(1), th:nth-child(2) { text-align: left; }
        th:nth-child(2) { width: 25%; }

        tr {
            background-color: var(--panel-bg);
            transition: all 0.2s ease;
            border-radius: 6px;
            cursor: pointer;
        }

        tr:hover {
            background-color: #1a1a1a;
            transform: scale(1.002);
        }

        /* LINHA SELECIONADA NA TABELA */
        tr.selected-row {
            outline: 2px solid var(--yellow-gold) !important;
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.15) 0%, rgba(30, 28, 10, 0.95) 100%) !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.35) !important;
        }

        td {
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            text-align: right;
            font-weight: 500;
            color: #e5e5e5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td:nth-child(1), td:nth-child(2) { text-align: left; }

        td.rank-col { 
            font-weight: 800; 
            color: var(--text-muted); 
            text-align: center;
            font-size: 1.1rem;
            width: 80px;
        }

        td.regional-col, td.horizonte-col {
            font-weight: 700;
            color: #a0a0a0;
            text-align: center;
        }
        
        td.unit-col {
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* BADGES DE RANKING (1º, 2º, 3º) */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 32px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1.1rem;
        }

        /* SUPER DESTAQUES - TOP 3 */
        tr.top-rank-1 {
            background: linear-gradient(90deg, rgba(229, 9, 20, 0.22) 0%, rgba(24, 12, 14, 0.95) 100%);
            outline: 2px solid var(--v4-red);
            box-shadow: 0 0 18px var(--v4-red-glow);
        }
        tr.top-rank-1 td {
            padding: 1.1rem 1rem;
            font-size: 1.05rem;
            font-weight: 600;
        }
        tr.top-rank-1 .rank-badge {
            background: var(--v4-red);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.8);
        }
        tr.top-rank-1 td.unit-col {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        tr.top-rank-2 {
            background: linear-gradient(90deg, rgba(224, 224, 224, 0.15) 0%, rgba(20, 20, 20, 0.95) 100%);
            outline: 2px solid var(--silver);
            box-shadow: 0 0 12px rgba(224, 224, 224, 0.2);
        }
        tr.top-rank-2 td {
            padding: 1rem 1rem;
            font-size: 1.02rem;
            font-weight: 600;
        }
        tr.top-rank-2 .rank-badge {
            background: var(--silver);
            color: #111111;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        tr.top-rank-2 td.unit-col {
            color: #ffffff;
            font-size: 1.08rem;
            font-weight: 800;
        }

        tr.top-rank-3 {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.18) 0%, rgba(20, 18, 14, 0.95) 100%);
            outline: 2px solid var(--bronze);
            box-shadow: 0 0 12px rgba(205, 127, 50, 0.25);
        }
        tr.top-rank-3 td {
            padding: 0.95rem 1rem;
            font-size: 1rem;
            font-weight: 600;
        }
        tr.top-rank-3 .rank-badge {
            background: var(--bronze);
            color: #ffffff;
            box-shadow: 0 0 8px rgba(205, 127, 50, 0.5);
        }
        tr.top-rank-3 td.unit-col {
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 800;
        }

        /* Progress Bar V4 Red */
        .progress-cell {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .progress-text {
            font-weight: 700;
            width: 65px;
            text-align: right;
            color: #fff;
        }

        .progress-bar-bg {
            width: 80px;
            height: 8px;
            background-color: var(--bar-bg);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--v4-red);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--v4-red-glow);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO DA PÁGINA (FIXADO) -->
    <header>
        <div class="header-brand">
            <h1 id="page-main-title">Ranking Unidades</h1>
        </div>
        <div class="header-controls">
            <!-- TOGGLE DE SEMANA -->
            <div class="week-toggle-container">
                <button id="btn-current-week" class="week-btn active" onclick="setWeekMode('current')">Semana Atual</button>
                <button id="btn-prev-week" class="week-btn" onclick="setWeekMode('prev')">Semana Anterior</button>
            </div>

            <!-- FILTRO DE HORIZONTE (SIGLAS) -->
            <select id="horizonte-filter" class="v4-select">
                <option value="all">Todos os Horizontes</option>
            </select>

            <!-- FILTRO DE REGIONAL COM SETA AJUSTADA -->
            <select id="regional-filter" class="v4-select">
                <option value="all">Todas as Regionais</option>
            </select>

            <div class="header-month" id="current-month">
                <!-- SETEMBRO DE 2026 -->
            </div>
            <img src="logo-v4.jpg" alt="V4 Company" class="v4-logo-right">
        </div>
    </header>

    <!-- SEÇÃO DOS COPOS (PROGRESSO DAS SEMANAS) -->
    <section class="glasses-section">
        <div class="glasses-container" id="glasses-container">
            <!-- Renderizado dinamicamente via JS -->
        </div>
    </section>

    <!-- TABELA DE DADOS -->
    <section class="table-section">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-col="realizadoNum"><span>Rank <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="unidade"><span>Unidade <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="provisionadoNum"><span>Meta Mês <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="metaSemanaNum"><span>Meta Semana <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="recebidoNum"><span>Recebido <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="deltaSemanaNum"><span>Delta Semana <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="realizadoNum"><span>Realizado <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="disponivelAnoNum"><span>Disponível Ano <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="horizonteSigla"><span>Horizonte <i class="sort-icon">↕</i></span></th>
                        <th class="sortable" data-col="str_regional"><span>Regional <i class="sort-icon">↕</i></span></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </section>

    <script>
        let allData = [];
        let weekMode = 'current'; // 'current' ou 'prev'
        let currentSortCol = 'realizadoNum';
        let currentSortDir = 'desc';
        let selectedUnitName = null; // Unidade atualmente selecionada ao clicar na linha

        // ATUALIZAR MÊS VIGENTE (EX: SETEMBRO DE 2026)
        function updateCurrentMonth() {
            const now = new Date();
            const monthNames = [
                "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
                "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
            ];
            const monthStr = monthNames[now.getMonth()];
            const yearStr = now.getFullYear();
            document.getElementById('current-month').textContent = `${monthStr} DE ${yearStr}`;
        }
        updateCurrentMonth();

        // EXTRAIR SIGLA DO HORIZONTE (EX: "H1 - Aceleração" -> "H1")
        function getHorizonteSigla(horizStr) {
            if (!horizStr) return '-';
            let parts = horizStr.toString().trim().split(' ');
            return parts[0].toUpperCase();
        }

        // CONVERTER VALOR BRASILEIRO PARA FLOAT
        function parseBrFloat(str) {
            if (str === undefined || str === null || str === '') return 0;
            if (typeof str === 'number') return str;
            let s = str.toString().replace(/R\$\s?/, '').replace('%', '').trim();
            if (s.includes(',')) {
                s = s.replace(/\./g, '').replace(',', '.');
            } else if (s.includes('.')) {
                let parts = s.split('.');
                if (parts.length > 2 || parts[parts.length - 1].length === 3) {
                    s = s.replace(/\./g, '');
                }
            }
            let num = parseFloat(s);
            return isNaN(num) ? 0 : num;
        }

        // FORMATAR MOEDA COM R$ E SEMPRE 2 CASAS DECIMAIS (PARA A LISTA)
        function formatCurrency(val) {
            if (val === undefined || val === null || val === '') return 'R$ 0,00';
            let num = parseBrFloat(val);
            return 'R$ ' + num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // FORMATAR MOEDA SEM CENTAVOS (EXCLUSIVO PARA OS COPOS)
        function formatCurrencyNoCents(val) {
            if (val === undefined || val === null || val === '') return 'R$ 0';
            let num = Math.round(parseBrFloat(val));
            return 'R$ ' + num.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
        }

        // FORMATAR PORCENTAGEM COM SEMPRE 2 CASAS DECIMAIS (PARA A LISTA)
        function formatPct(val) {
            if (val === undefined || val === null || val === '') return '0,00%';
            let num = parseBrFloat(val);
            return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
        }

        // LIMPAR PREFIXO V4 COMPANY
        function cleanUnitName(name) {
            if (!name) return '';
            return name.replace(/^V4\s+Company\s+/i, '').trim();
        }

        // ALTERAR MODO DE SEMANA (TOGGLE)
        function setWeekMode(mode) {
            weekMode = mode;
            document.getElementById('btn-current-week').classList.toggle('active', mode === 'current');
            document.getElementById('btn-prev-week').classList.toggle('active', mode === 'prev');
            
            recalculateData();
            applyFilterAndSort();
        }

        // RECALCULAR DADOS CONFORME A SEMANA SELECIONADA
        function recalculateData() {
            allData.forEach(item => {
                const semanaCorteNum = parseInt(item.semana_corte || '3', 10);
                let targetWeekNum = semanaCorteNum;

                if (weekMode === 'prev') {
                    targetWeekNum = Math.max(1, semanaCorteNum - 1);
                }

                // 1. Meta Semana Acumulada
                const metaSemanaAcum = parseBrFloat(item['semana_' + targetWeekNum] || '0');

                item.metaSemanaStr = metaSemanaAcum.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                item.metaSemanaNum = metaSemanaAcum;

                // 2. Recebido
                const recebidoKey = 'recebido_ate_sem' + targetWeekNum;
                const recebidoVal = item[recebidoKey] !== undefined ? item[recebidoKey] : (item.recebido || '0');
                item.recebidoStr = recebidoVal;
                item.recebidoNum = parseBrFloat(recebidoVal);

                // 3. Realizado %
                const realizadoKey = 'realizado_sem' + targetWeekNum;
                const realizadoVal = item[realizadoKey] !== undefined ? item[realizadoKey] : (item.realizado || '0%');
                item.realizadoStr = realizadoVal;
                item.realizadoNum = parseBrFloat(realizadoVal);

                // 4. Delta Semana (Faltante Meta da Semana): Max(0, MetaSemana - RecebidoAtéAquelePonto)
                let deltaNum = item.metaSemanaNum - item.recebidoNum;
                if (deltaNum < 0) deltaNum = 0;
                item.deltaSemanaNum = deltaNum;
                item.deltaSemanaStr = deltaNum.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            });
        }

        // CARREGAMENTO DO JSON
        async function loadData() {
            try {
                const response = await fetch('dados.json.json');
                if (!response.ok) throw new Error('Falha ao carregar o arquivo JSON.');
                const data = await response.json();
                
                allData = data.map(item => {
                    return {
                        ...item,
                        unidade: cleanUnitName(item.unidade),
                        provisionadoNum: parseBrFloat(item.provisionado),
                        disponivelAnoNum: parseBrFloat(item.disponivel_ano),
                        horizonteRaw: item.horizonte || '',
                        horizonteSigla: getHorizonteSigla(item.horizonte)
                    };
                });

                recalculateData();
                populateFilters(allData);
                setupSortHeaders();
                setupRowSelection();
                applyFilterAndSort();
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--v4-red);">Erro ao carregar dados. Certifique-se de que o arquivo 'dados.json.json' está na mesma pasta.</td></tr>`;
            }
        }

        // POPULAR FILTROS DE REGIONAIS E HORIZONTES (APENAS SIGLAS NO DROPDOWN)
        function populateFilters(data) {
            // Filtro de Regionais
            const regFilter = document.getElementById('regional-filter');
            const regionais = [...new Set(data.map(item => item.str_regional).filter(r => r && r.trim() !== ''))].sort();
            
            regionais.forEach(reg => {
                const option = document.createElement('option');
                option.value = reg;
                option.textContent = reg;
                regFilter.appendChild(option);
            });

            regFilter.addEventListener('change', () => {
                applyFilterAndSort();
            });

            // Filtro de Horizontes (Popula apenas com Siglas únicas: H1, H2, H3, H4, H5)
            const horizFilter = document.getElementById('horizonte-filter');
            const horizontesSiglas = [...new Set(data.map(item => item.horizonteSigla).filter(h => h && h !== '-'))].sort();

            horizontesSiglas.forEach(sigla => {
                const option = document.createElement('option');
                option.value = sigla;
                option.textContent = sigla; // Exibe apenas a sigla (ex: "H1", "H2")
                horizFilter.appendChild(option);
            });

            horizFilter.addEventListener('change', () => {
                applyFilterAndSort();
            });
        }

        // CONFIGURAR CLIQUE NOS CABEÇALHOS PARA ORDENAÇÃO
        function setupSortHeaders() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.getAttribute('data-col');
                    if (currentSortCol === col) {
                        currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSortCol = col;
                        currentSortDir = 'desc';
                    }
                    applyFilterAndSort();
                });
            });
        }

        // CONFIGURAR CLIQUE NAS LINHAS DA TABELA (SELEÇÃO DA UNIDADE)
        function setupRowSelection() {
            const tableBody = document.getElementById('table-body');
            tableBody.addEventListener('click', (e) => {
                const tr = e.target.closest('tr');
                if (!tr) return;

                const unitName = tr.getAttribute('data-unit');
                if (!unitName) return;

                // Se clicou na unidade ja selecionada, deseleciona
                if (selectedUnitName === unitName) {
                    selectedUnitName = null;
                } else {
                    selectedUnitName = unitName;
                }

                applyFilterAndSort();
            });
        }

        // APLICAR FILTRAGEM, RECALCULAR COPOS E ORDENAR LISTA
        function applyFilterAndSort() {
            const selectedReg = document.getElementById('regional-filter').value;
            const selectedHorizSigla = document.getElementById('horizonte-filter').value;
            const mainTitleEl = document.getElementById('page-main-title');

            let filtered = allData;

            if (selectedReg !== 'all') {
                filtered = filtered.filter(item => item.str_regional === selectedReg);
            }

            if (selectedHorizSigla !== 'all') {
                filtered = filtered.filter(item => item.horizonteSigla === selectedHorizSigla);
            }

            // Verificar se a unidade selecionada ainda esta nos dados filtrados
            if (selectedUnitName) {
                const unitExists = filtered.some(item => item.unidade === selectedUnitName);
                if (!unitExists) {
                    selectedUnitName = null;
                }
            }

            // Atualizar Titulo do Cabeçalho
            if (selectedUnitName) {
                mainTitleEl.textContent = `METAS ${selectedUnitName}`;
            } else if (selectedReg !== 'all') {
                mainTitleEl.textContent = `RANKING ${selectedReg}`;
            } else if (selectedHorizSigla !== 'all') {
                mainTitleEl.textContent = `RANKING ${selectedHorizSigla}`;
            } else {
                mainTitleEl.textContent = 'RANKING UNIDADES';
            }

            // Renderizar secao dos copos para a unidade selecionada OU para o grupo filtrado
            if (selectedUnitName) {
                const unitData = allData.filter(item => item.unidade === selectedUnitName);
                renderGlasses(unitData);
            } else {
                renderGlasses(filtered);
            }

            // Ordenar lista
            const sorted = [...filtered].sort((a, b) => {
                let valA = a[currentSortCol];
                let valB = b[currentSortCol];

                if (typeof valA === 'string') {
                    valA = valA.toLowerCase();
                    valB = (valB || '').toLowerCase();
                    return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }

                valA = valA || 0;
                valB = valB || 0;
                return currentSortDir === 'asc' ? valA - valB : valB - valA;
            });

            // Atualiza indicadores visuais dos cabeçalhos
            document.querySelectorAll('th.sortable').forEach(th => {
                const col = th.getAttribute('data-col');
                const icon = th.querySelector('.sort-icon');
                if (col === currentSortCol) {
                    th.classList.add('active-sort');
                    icon.textContent = currentSortDir === 'asc' ? '▲' : '▼';
                } else {
                    th.classList.remove('active-sort');
                    icon.textContent = '↕';
                }
            });

            renderTable(sorted);
        }

        // RENDERIZAR OS COPOS COM TAMANHO PROPORCIONAL À META DA PRÓPRIA SEMANA (DESACUMULADA)
        function renderGlasses(data) {
            const container = document.getElementById('glasses-container');
            if (!container) return;

            if (data.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); width:100%;">Nenhum dado encontrado para a exibição dos copos.</div>';
                return;
            }

            // Identificar qual semana de corte considerar para a exibicao
            let corteWeek = 3;
            if (data[0] && data[0].semana_corte) {
                corteWeek = parseInt(data[0].semana_corte, 10) || 3;
            }
            if (weekMode === 'prev') {
                corteWeek = Math.max(1, corteWeek - 1);
            }

            // 1. Calcular Metas Individuais (Desacumuladas) e Recebidos Individuais por Semana (1 a 5)
            let weekMetasIndividuais = [0, 0, 0, 0, 0];
            let weekRecebidosIndividuais = [0, 0, 0, 0, 0];

            data.forEach(item => {
                let prevMetaAcum = 0;
                let prevRecAcum = 0;

                for (let w = 1; w <= 5; w++) {
                    // Meta
                    const currMetaAcum = parseBrFloat(item['semana_' + w] || '0');
                    const metaPropria = Math.max(0, currMetaAcum - prevMetaAcum);
                    weekMetasIndividuais[w - 1] += metaPropria;
                    prevMetaAcum = currMetaAcum;

                    // Recebido
                    if (w <= corteWeek) {
                        const recKey = 'recebido_ate_sem' + w;
                        const currRecAcum = item[recKey] !== undefined ? parseBrFloat(item[recKey]) : parseBrFloat(item.recebido);
                        const recProprio = Math.max(0, currRecAcum - prevRecAcum);
                        weekRecebidosIndividuais[w - 1] += recProprio;
                        prevRecAcum = currRecAcum;
                    }
                }
            });

            // Meta Máxima entre as semanas para servir de referência do tamanho do copo (capacidade)
            const maxWeekMetaIndiv = Math.max(...weekMetasIndividuais) || 1;
            const maxGlassHeightPx = 135; // Altura máxima em pixels para a semana de maior meta
            const minGlassHeightPx = 40;  // Altura mínima visual

            let html = '';

            for (let w = 1; w <= 5; w++) {
                const sumMetaIndiv = weekMetasIndividuais[w - 1];
                let sumRecebidoIndiv = weekRecebidosIndividuais[w - 1];

                // Tamanho proporcional da estrutura do copo baseado na Meta Individual da Semana
                let glassOuterHeight = Math.round((sumMetaIndiv / maxWeekMetaIndiv) * maxGlassHeightPx);
                if (glassOuterHeight < minGlassHeightPx && sumMetaIndiv > 0) {
                    glassOuterHeight = minGlassHeightPx;
                }

                let pct = sumMetaIndiv > 0 ? (sumRecebidoIndiv / sumMetaIndiv) * 100 : 0;
                let fillHeight = Math.min(100, pct);

                let borderStyle = '';
                let fillColor = '';

                if (w < corteWeek) {
                    // Semanas passadas
                    if (pct >= 100) {
                        borderStyle = 'border: 2px solid #00E676;';
                        fillColor = '#00E676';
                    } else {
                        borderStyle = 'border: 2px solid #E50914;';
                        fillColor = '#E50914';
                    }
                } else if (w === corteWeek) {
                    // Semana atual/ativa
                    borderStyle = 'border: 2px dashed #FFD700; box-shadow: 0 0 12px rgba(255, 215, 0, 0.35);';
                    fillColor = pct >= 100 ? '#00E676' : '#E50914';
                } else {
                    // Semanas futuras
                    borderStyle = 'border: 2px dashed #3a3a3a;';
                    fillColor = 'transparent';
                    fillHeight = 0;
                    sumRecebidoIndiv = 0;
                    pct = 0;
                }

                const formattedRecebido = formatCurrencyNoCents(sumRecebidoIndiv);
                const formattedMeta = formatCurrencyNoCents(sumMetaIndiv);
                const formattedPct = pct.toFixed(1).replace('.', ',') + '%';

                html += `
                    <div class="glass-card">
                        <div class="glass-top-realizado">${formattedRecebido}</div>
                        <div class="glass-outer" style="height: ${glassOuterHeight}px; ${borderStyle}">
                            <div class="glass-inner" style="height: ${fillHeight}%; background-color: ${fillColor};"></div>
                            <div class="glass-pct-overlay">${formattedPct}</div>
                        </div>
                        <div class="glass-week-title">Semana ${w}</div>
                        <div class="glass-bottom-meta">${formattedMeta}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // RENDERIZAR TABELA DA LISTA (SEMPRE COM 2 CASAS DECIMAIS)
        function renderTable(data) {
            const tableBody = document.getElementById('table-body');
            let html = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" style="text-align:center;">Nenhuma unidade encontrada para os filtros selecionados.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const realRank = index + 1; // Posição atual na lista filtrada
                const progressWidth = row.realizadoNum > 100 ? 100 : row.realizadoNum;
                
                // Estruturação do Rank com Badge de Destaque para o Top 3
                let rankRowClass = '';
                let rankDisplay = `${realRank}º`;

                if (realRank === 1) {
                    rankRowClass = 'top-rank-1';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                } else if (realRank === 2) {
                    rankRowClass = 'top-rank-2';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                } else if (realRank === 3) {
                    rankRowClass = 'top-rank-3';
                    rankDisplay = `<span class="rank-badge">${realRank}º</span>`;
                }

                // Classe de Seleção ao Clicar na Linha
                const selectedClass = (row.unidade === selectedUnitName) ? 'selected-row' : '';

                html += `
                    <tr class="${rankRowClass} ${selectedClass}" data-unit="${row.unidade}">
                        <td class="rank-col">${rankDisplay}</td>
                        <td class="unit-col" title="${row.unidade}">${row.unidade}</td>
                        <td>${formatCurrency(row.provisionadoNum)}</td>
                        <td>${formatCurrency(row.metaSemanaNum)}</td>
                        <td>${formatCurrency(row.recebidoNum)}</td>
                        <td>${formatCurrency(row.deltaSemanaNum)}</td>
                        <td>
                            <div class="progress-cell">
                                <span class="progress-text">${formatPct(row.realizadoNum)}</span>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${progressWidth}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td>${formatCurrency(row.disponivelAnoNum)}</td>
                        <td class="horizonte-col" title="${row.horizonteRaw}">${row.horizonteSigla}</td>
                        <td class="regional-col">${row.str_regional || '-'}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

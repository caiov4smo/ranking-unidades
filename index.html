<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Unidades - V4 Company</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #111111;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-muted: #888888;
            --v4-red: #E50914;
            --v4-red-glow: rgba(229, 9, 20, 0.4);
            --green-bright: #00E676;
            --gold: #FFD700;
            --silver: #E0E0E0;
            --bronze: #CD7F32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2.5rem;
            background: #000000;
            border-bottom: 2px solid var(--v4-red);
        }

        .header-brand h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .v4-select {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid var(--v4-red);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .header-month {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .v4-logo-right {
            height: 42px;
            width: 42px;
            object-fit: contain;
        }

        /* MAIN CONTENT AREA */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2.5rem;
            overflow-y: auto;
            gap: 1.5rem;
        }

        .main-container::-webkit-scrollbar {
            width: 8px;
        }
        .main-container::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        .main-container::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        /* PÓDIO TOP 3 */
        .podium-section {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 1.5rem;
            padding-top: 1rem;
            min-height: 270px;
        }

        .podium-card {
            background: var(--panel-bg);
            border-radius: 6px;
            padding: 1.5rem 1.2rem 1.2rem 1.2rem;
            text-align: center;
            width: 320px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #222;
        }

        /* CARD PLACEMENT SPECIFICS */
        .podium-card.rank-1 {
            min-height: 260px;
            z-index: 3;
            border-top: 3px solid var(--v4-red);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.2);
        }

        .podium-card.rank-2 {
            min-height: 235px;
            z-index: 2;
            border-top: 3px solid var(--silver);
        }

        .podium-card.rank-3 {
            min-height: 215px;
            z-index: 1;
            border-top: 3px solid var(--bronze);
        }

        /* BADGES DO TOPO DO PÓDIO */
        .podium-badge {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 2px 14px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .rank-1 .podium-badge {
            background: var(--v4-red);
            color: #ffffff;
        }

        .rank-2 .podium-badge {
            background: #181818;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .rank-3 .podium-badge {
            background: #181818;
            color: var(--bronze);
            border: 2px solid var(--bronze);
        }

        /* FOTO DA UNIDADE / AVATAR */
        .podium-avatar {
            width: 65px;
            height: 65px;
            margin: 0.5rem 0;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid var(--v4-red);
            background: #000;
        }

        .podium-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .podium-name {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-transform: uppercase;
        }

        .rank-1 .podium-name { color: var(--v4-red); }
        .rank-2 .podium-name { color: #ffffff; }
        .rank-3 .podium-name { color: #ffffff; }

        .podium-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--green-bright);
            line-height: 1.1;
        }

        .podium-subvalue {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 2px;
            margin-bottom: 0.8rem;
        }

        .podium-pct-pill {
            padding: 4px 14px;
            font-size: 0.9rem;
            font-weight: 800;
            border-radius: 3px;
        }

        .rank-1 .podium-pct-pill {
            background: var(--v4-red);
            color: #ffffff;
        }

        .rank-2 .podium-pct-pill, .rank-3 .podium-pct-pill {
            background: #222222;
            color: #888888;
        }

        /* LISTA DO 4º LUGAR EM DIANTE */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .ranking-item {
            background: var(--panel-bg);
            border: 1px solid #222222;
            border-radius: 4px;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .ranking-item:hover {
            background: #181818;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .item-rank-box {
            width: 38px;
            height: 38px;
            background: #1a1a1a;
            border: 1px solid #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: #777777;
            border-radius: 3px;
        }

        .item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            border: 1px solid var(--v4-red);
            overflow: hidden;
            background: #000;
        }

        .item-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item-progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-bar-bg {
            width: 160px;
            height: 6px;
            background: #2a2a2a;
            border-radius: 3px;
            overflow: hidden;
        }

        .item-bar-fill {
            height: 100%;
            background: var(--v4-red);
            border-radius: 3px;
        }

        .item-pct-text {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--v4-red);
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .item-val-green {
            color: var(--green-bright);
        }

        .item-val-slash {
            color: #555555;
            font-weight: 400;
        }

        .item-val-grey {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-brand">
            <h1>Ranking Unidades</h1>
        </div>
        <div class="header-controls">
            <!-- Filtro por Regional -->
            <select id="regional-filter" class="v4-select">
                <option value="all">Todas as Regionais</option>
            </select>
            <div class="header-month" id="current-month">
                <!-- SETEMBRO DE 2026 -->
            </div>
            <img src="logo-v4.jpg" alt="V4 Company" class="v4-logo-right">
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-container">
        <!-- PÓDIO TOP 3 -->
        <section class="podium-section" id="podium-container">
        </section>

        <!-- LISTA DO 4º EM DIANTE -->
        <section class="ranking-list" id="ranking-list-container">
        </section>
    </div>

    <script>
        let allData = [];

        // ATUALIZAR MÊS VIGENTE (EX: SETEMBRO DE 2026)
        function updateCurrentMonth() {
            const now = new Date();
            const monthNames = [
                "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
                "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
            ];
            const monthStr = monthNames[now.getMonth()];
            const yearStr = now.getFullYear();
            document.getElementById('current-month').textContent = `${monthStr} DE ${yearStr}`;
        }
        updateCurrentMonth();

        // FORMATAR MOEDA COM R$
        function formatCurrency(val) {
            if (val === undefined || val === null || val === '') return 'R$ 0,00';
            if (val.toString().includes('R$')) return val;
            return 'R$ ' + val;
        }

        // LIMPAR PREFIXO V4 COMPANY
        function cleanUnitName(name) {
            if (!name) return '';
            return name.replace(/^V4\s+Company\s+/i, '').trim();
        }

        // CARREGAMENTO DO JSON
        async function loadData() {
            try {
                const response = await fetch('dados.json');
                if (!response.ok) throw new Error('Falha ao carregar o arquivo JSON.');
                const data = await response.json();
                
                allData = data.map(item => {
                    let realizadoLimpo = (item.realizado || '0').replace('%', '').replace(',', '.');
                    let realizadoNum = parseFloat(realizadoLimpo);
                    if (isNaN(realizadoNum)) realizadoNum = 0;

                    return {
                        ...item,
                        unidade: cleanUnitName(item.unidade),
                        realizadoNum: realizadoNum
                    };
                });

                populateFilter(allData);
                renderDashboard(allData);
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('ranking-list-container').innerHTML = `<div style="text-align:center; color:var(--v4-red); padding: 2rem;">Erro ao carregar dados. Certifique-se de que o arquivo 'dados.json' está na mesma pasta.</div>`;
            }
        }

        // POPULAR FILTRO DE REGIONAIS
        function populateFilter(data) {
            const filter = document.getElementById('regional-filter');
            const regionais = [...new Set(data.map(item => item.str_regional).filter(r => r && r.trim() !== ''))].sort();
            
            regionais.forEach(reg => {
                const option = document.createElement('option');
                option.value = reg;
                option.textContent = reg;
                filter.appendChild(option);
            });

            filter.addEventListener('change', (e) => {
                const selected = e.target.value;
                if (selected === 'all') {
                    renderDashboard(allData);
                } else {
                    const filtered = allData.filter(item => item.str_regional === selected);
                    renderDashboard(filtered);
                }
            });
        }

        // RENDERIZAR DASHBOARD
        function renderDashboard(data) {
            const sortedData = [...data].sort((a, b) => b.realizadoNum - a.realizadoNum);
            
            const top3 = sortedData.slice(0, 3);
            const rest = sortedData.slice(3);

            renderPodium(top3);
            renderList(rest, 4);
        }

        // RENDERIZAR PÓDIO TOP 3
        function renderPodium(top3) {
            const podiumContainer = document.getElementById('podium-container');
            podiumContainer.innerHTML = '';
            
            if (top3.length === 0) return;

            // Ordenação visual: 2º lugar (esquerda), 1º lugar (centro), 3º lugar (direita)
            const podiumOrder = [];
            if (top3[1]) podiumOrder.push({ rank: 2, class: 'rank-2', data: top3[1] });
            if (top3[0]) podiumOrder.push({ rank: 1, class: 'rank-1', data: top3[0] });
            if (top3[2]) podiumOrder.push({ rank: 3, class: 'rank-3', data: top3[2] });

            let html = '';
            podiumOrder.forEach(item => {
                html += `
                    <div class="podium-card ${item.class}">
                        <div class="podium-badge">${item.rank}º</div>
                        <div class="podium-avatar">
                            <img src="logo-v4.jpg" alt="${item.data.unidade}" onerror="this.src='https://via.placeholder.com/65/000/E50914?text=V4'">
                        </div>
                        <div class="podium-name" title="${item.data.unidade}">${item.data.unidade}</div>
                        <div class="podium-value">${formatCurrency(item.data.recebido)}</div>
                        <div class="podium-subvalue">${formatCurrency(item.data.provisionado)}</div>
                        <div class="podium-pct-pill">${item.data.realizado}</div>
                    </div>
                `;
            });

            podiumContainer.innerHTML = html;
        }

        // RENDERIZAR LISTA DO 4º LUGAR EM DIANTE
        function renderList(restData, startRank) {
            const listContainer = document.getElementById('ranking-list-container');
            listContainer.innerHTML = '';

            if (restData.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:#888; padding: 1rem;">Nenhuma unidade para exibir nesta categoria.</div>';
                return;
            }

            let html = '';
            restData.forEach((row, index) => {
                const currentRank = startRank + index;
                const progressWidth = row.realizadoNum > 100 ? 100 : row.realizadoNum;

                html += `
                    <div class="ranking-item">
                        <div class="item-left">
                            <div class="item-rank-box">${currentRank}</div>
                            <div class="item-avatar">
                                <img src="logo-v4.jpg" alt="${row.unidade}" onerror="this.src='https://via.placeholder.com/42/000/E50914?text=V4'">
                            </div>
                            <div class="item-info">
                                <div class="item-name">${row.unidade}</div>
                                <div class="item-progress-row">
                                    <div class="item-bar-bg">
                                        <div class="item-bar-fill" style="width: ${progressWidth}%;"></div>
                                    </div>
                                    <span class="item-pct-text">${row.realizado || '0%'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="item-right">
                            <span class="item-val-green">${formatCurrency(row.recebido)}</span>
                            <span class="item-val-slash">/</span>
                            <span class="item-val-grey">${formatCurrency(row.provisionado)}</span>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
